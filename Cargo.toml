[workspace]
members = [
    "bin/api",
    "bin/cli",
    "crates/invoice-decoder",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
dotenvy = "0.15"
lightning-invoice = { version = "0.34.1", features = ["std"] }
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "=0.3.53", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "set-header", "trace"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }

invoice-decoder = { path = "crates/invoice-decoder" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
